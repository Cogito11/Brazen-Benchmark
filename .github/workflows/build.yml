name: Build

# Reusable workflow: builds Brazen for Linux, Windows, and macOS and
# uploads each as a workflow artifact. Called by rolling.yml (on every
# push to main) and release.yml (on a version tag push) so the actual
# build steps only need to be maintained in one place.
on:
  workflow_call:
    inputs:
      version:
        description: "Version string baked into the binary (App Info screen) via -DBRAZEN_VERSION"
        required: true
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: Brazen-linux-x86_64
          - os: windows-latest
            artifact_name: Brazen-windows-x86_64
          - os: macos-latest
            artifact_name: Brazen-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Deliberately NOT installing libglfw3-dev here. This build's
      # binaries get distributed to other people's machines, and if
      # find_package(glfw3) succeeds it links against the *shared*
      # system libglfw.so.3 -- which only exists on machines that
      # happen to have that package installed, i.e. almost nobody's.
      # Omitting it forces CMakeLists.txt's FetchContent fallback,
      # which builds GLFW as a static library (its own CMake default)
      # with no such runtime dependency. xorg-dev/libgl1-mesa-dev are
      # still needed for GLFW to build its X11 backend from source.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake libgl1-mesa-dev xorg-dev build-essential xvfb

      # Same reasoning as the Linux dependencies above: not installing
      # glfw via Homebrew, so the FetchContent fallback provides a
      # statically-linked GLFW instead of one dynamically linked
      # against a Homebrew-managed dylib that won't exist on a Mac
      # without Homebrew (i.e. most of them).
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBRAZEN_VERSION="${{ inputs.version }}"

      - name: Build
        run: cmake --build build --parallel

      # Prints exactly what got built, so "is this actually the GUI
      # app" is answered directly in the CI log rather than requiring
      # someone to download and inspect the artifact to find out.
      - name: Inspect build output
        shell: bash
        run: |
          BIN=build/Brazen
          [ -f "$BIN" ] || BIN=build/Brazen.exe
          ls -la "$BIN"
          file "$BIN" || true

      # Runs the headless console harness as a smoke test before
      # packaging anything -- if the core benchmarking logic itself is
      # broken, better to fail loudly here than ship a build of it.
      - name: Smoke-test core logic (headless, no GPU/display needed)
        shell: bash
        run: |
          if [ -f build/BrazenCoreTest ]; then ./build/BrazenCoreTest
          else ./build/BrazenCoreTest.exe
          fi

      # Actually launches the GUI binary itself (under a virtual X
      # display, since CI has no real one) rather than just the console
      # test above. This is the check that would have caught the
      # dynamic-linking-against-a-package-that-won't-exist-on-the-
      # user's-machine class of bug (see the dependency-install
      # comments above) before it ever shipped: BrazenCoreTest never
      # links GLFW at all, so it can't detect a broken Brazen binary.
      - name: Smoke-test GUI launch (Linux, under Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          export DISPLAY=:99
          # Xvfb takes a moment to actually bind the display after being
          # backgrounded; launching Brazen immediately (what an earlier
          # version of this step did) races it and fails with "Failed to
          # open display :99" even though Xvfb is about to be ready.
          # Poll for its lock file instead of guessing a fixed sleep.
          for i in $(seq 1 20); do
            [ -e /tmp/.X99-lock ] && break
            sleep 0.25
          done
          timeout 5 ./build/Brazen &
          APP_PID=$!
          sleep 2
          if ! kill -0 $APP_PID 2>/dev/null; then
            echo "Brazen exited within 2 seconds of launch -- treating as a smoke-test failure."
            wait $APP_PID
            exit 1
          fi
          echo "Brazen is still running after 2 seconds, looks healthy."
          kill $APP_PID

      # Windows runners have a usable desktop session, so no Xvfb
      # equivalent is needed here -- just launch the built exe directly.
      # This is the check that would have caught the missing-DLL bug
      # (Brazen.exe depending on the MSVC redistributable) before it
      # ever shipped, the same way the Linux step above catches the
      # equivalent class of bug for shared-library dependencies.
      - name: Smoke-test GUI launch (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "build/Brazen.exe" -PassThru
          Start-Sleep -Seconds 2
          if ($proc.HasExited) {
            Write-Host "Brazen.exe exited within 2 seconds of launch -- treating as a smoke-test failure."
            exit 1
          }
          Write-Host "Brazen.exe is still running after 2 seconds, looks healthy."
          Stop-Process -Id $proc.Id -Force

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd build
          tar -czf "../${{ matrix.artifact_name }}.tar.gz" Brazen

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/Brazen.exe -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}.zip
          if-no-files-found: ignore
          retention-days: 14
